name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/sync_shared.py --check
      - run: python -m unittest discover -s tests -v
      - run: python shared/export_report.py examples/task-queue/eval --check
      - run: python scripts/scorecard.py --skip-tests --min 98 --md scorecard.md
